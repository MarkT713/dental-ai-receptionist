[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-ai-receptionist"
version = "1.1.0"
description = "Human-approved after-hours dental AI intake and scheduling sandbox"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mark Testa"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
  "bandit>=1.8,<2",
  "pip-audit>=2.8,<3",
  "cyclonedx-bom>=5,<8",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["practice_management_software/main.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
